[project]
name = "entirius-py-get-response-sdk"
version = "3.0.0"
description = "GetResponse email marketing SDK for Python, part of Entirius, the open-source modular ecommerce platform"
keywords = ["getresponse", "email-marketing", "marketing-automation", "sdk", "ecommerce", "entirius"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "requests>=2.28.1",
    "marshmallow-dataclass>=8.5",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest"]

[project.urls]
Homepage = "https://docs.entirius.com/"
Documentation = "https://docs.entirius.com/"
Repository = "https://github.com/entirius/entirius-py-get-response-sdk"
Changelog = "https://github.com/entirius/entirius-py-get-response-sdk/blob/develop/CHANGELOG.md"
Issues = "https://github.com/entirius/entirius-py-get-response-sdk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/get_response_sdk"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Legacy SDK migrated 1:1 — deferred cleanup:
"src/get_response_sdk/get_response_sdk.py" = ["S113", "B006"]  # requests without timeout; mutable default params={}
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["get_response_sdk"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
